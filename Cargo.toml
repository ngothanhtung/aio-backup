[workspace]
resolver = "2"
members = ["crates/backup-core", "crates/backup-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
filetime = "0.2"
globset = "0.4"
sysinfo = "0.33"
directories = "6"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backup-core = { path = "crates/backup-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
